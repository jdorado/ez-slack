# Hold third-party updates for seven days; reviewed first-party releases are exempt.
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - "@jc_stack/*"
  - "@aifit/*"
trustPolicy: no-downgrade
blockExoticSubdeps: true
# undici is only a peer of @slack/socket-mode; 7.30.1 is the first release without the advisories.
overrides:
  undici: 7.30.1
